<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizdey</title>
    <!-- Font mirip Gagalin untuk Brand & Inter untuk teks biasa -->
    <link href="https://fonts.googleapis.com/css2?family=Carter+One&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Background gelap dengan corak dot pattern */
            background-color: #121212;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            min-height: 100vh;
            
            /* Setting flex untuk posisikan kotak di tengah persis */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            /* Ukuran & Rasio 3:4 */
            width: 100%;
            max-width: 340px; /* Lebar yang pas buat device, nggak kekecilan/kegedean */
            aspect-ratio: 3 / 4;
            
            /* Styling Kotak */
            background-color: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #D4AF37; /* Garis sudut warna emas tipis */
            border-radius: 12px;
            padding: 24px 20px;
            
            /* Layout isi kotak (Atas ke Bawah) */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .brand-name {
            font-family: 'Carter One', cursive;
            font-size: 24px;
            color: #ffffff;
            text-align: center;
            letter-spacing: 1px;
        }

        .image-wrapper {
            width: 100%;
            /* Rasio Foto 1:1 */
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            overflow: hidden;
            background-color: #2a2a2a; 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .description {
            color: #b3b3b3;
            font-size: 14px;
            text-align: center;
            line-height: 1.4;
            margin-top: 5px;
            margin-bottom: 5px;
            /* Membatasi baris teks biar nggak tumpah kalau kepanjangan */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn-lanjutkan {
            background-color: #f28500; /* Button warna abu-abu */
            color: #ffffff;
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-lanjutkan:active {
            transform: scale(0.97);
            background-color: #555555;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- 1. Name Brand -->
        <div class="brand-name">Vizdey</div>

        <!-- 2. Foto 1:1 -->
        <div class="image-wrapper">
            <!-- Ganti src dengan link gambar lu -->
            <img src="https://desiadin1299-glitch.github.io/screamu/assets/image/1793538160181.jpg" alt="Foto Konten">
        </div>

        <!-- 3. Keterangan Singkat -->
        <p class="description">
            Keterangan singkat mengenai foto di atas, tulis deskripsi atau hook lu di sini.
        </p>

        <!-- 4. Button Abu-abu -->
        <button class="btn-lanjutkan" id="btnLanjutkan">
            Lanjutkan &rarr;
        </button>
    </div>

    <script>
        // Kalau mau digabung sama script Smartlink + Cooldown 13 detik kayak sebelumnya, 
        // lu tinggal masukin fungsi triggerAction() ke dalam event listener ini.
        document.getElementById('btnLanjutkan').addEventListener('click', function() {
            // Contoh aksi normal
            window.location.href = "https://link-luar-tujuan-lu.com";
        });
    </script>
</body>
</html>
